version: 2

project_name: j-harness

before:
  hooks:
    - go mod tidy

builds:
  - id: harness
    main: ./cmd/harness
    binary: harness
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: harness
    ids:
      - harness
    # Fixed name so https://github.com/<owner>/<repo>/releases/latest/download/<name>
    # stays stable across versions (no version segment).
    name_template: "j-harness_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
