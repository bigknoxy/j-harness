name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Individual jobs raise it only if they must.
permissions:
  contents: read

# One run per ref: a new push cancels the previous, in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "unformatted:"; echo "$files"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        env:
          STATICCHECK_VERSION: v0.8.1
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          staticcheck ./...

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.27"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...

  # coverage runs the whole suite against a live Redis so the optional store
  # backend is exercised (the plain test matrix skips it when no server is
  # reachable). It also enforces the statement-coverage floor from
  # scripts/coverage.sh. Always runs, never path-filtered.
  coverage:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HARNESS_REDIS_ADDR: 127.0.0.1:6379
      COVERAGE_THRESHOLD: "70"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true
      - name: coverage gate
        run: sh scripts/coverage.sh

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true
      - name: govulncheck
        env:
          GOVULNCHECK_VERSION: v1.8.0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

  # dependency-review fails a PR that introduces a dependency with a known
  # vulnerability or a disallowed license. PR-only by nature.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

  # docs is intentionally NOT path-filtered: branch protection requires a check
  # by name, so a docs-only PR must still see this job run and report. It is a
  # pure-Go, offline drift gate (no network, no new dependency): routes, env
  # vars, and metrics in code vs docs, relative markdown links, version pin,
  # and the ASCII-only docs rule. See internal/docscheck.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true
      - name: docs drift
        run: go test ./internal/docscheck/...

  # pr-title enforces the Conventional Commits subject shape with the standard
  # action (SHA-pinned). It is a hard gate on every pull request; on a push it
  # has no title to check, so the job is skipped (a skipped job still reports a
  # non-blocking, success-equivalent status, which is safe to require). It needs
  # only pull-requests: read: the action's optional `wip: true` mode also updates
  # the PR status and would require write, but draft PRs already cover WIP.
  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            ci
            chore
            refactor
            perf
            build
            style
            revert
          requireScope: false
          subjectPattern: ^\S.*$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}" must be
            non-empty and start with a non-space character.

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true
      - name: smoke
        run: sh scripts/smoke.sh
